apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: employee-app-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/simha2508/enterprise-gitops.git
    targetRevision: main
    path: employee-app

  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-demo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
